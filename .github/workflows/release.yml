name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-registry:
    name: publish to the MCP registry
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      # The tag is the single source of truth. Publishing a version that does not
      # match it is the one failure mode worth engineering out, and it costs a line.
      - name: Pin server.json to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "publishing version $VERSION"

      - name: Validate
        run: ./mcp-publisher validate server.json

      # OIDC only authenticates the io.github.* namespace. This server is
      # io.skycloak/*, which is DNS-verified, so CI signs with the same Ed25519
      # key whose public half is the TXT record on the skycloak.io apex.
      - name: Authenticate
        run: ./mcp-publisher login dns --domain skycloak.io --private-key "$MCP_DNS_PRIVATE_KEY"
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}

      - name: Publish
        run: ./mcp-publisher publish

  # The plugin directories read the manifests from main rather than from the tag,
  # so pinning them in the job like server.json above would reach nobody. main
  # requires status checks, which a direct push never has, so the bump goes
  # through a pull request and lands on main once its checks pass, after the tag.
  # That also covers the releases a human cuts by hand instead of through
  # auto-release.
  sync-plugin-manifests:
    name: sync the plugin manifests to the tag
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set the manifest versions to the tag
        id: bump
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          for f in plugins/skycloak/.claude-plugin/plugin.json \
                   plugins/skycloak/.antigravity-plugin/plugin.json \
                   plugin.json \
                   .grok-plugin/plugin.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          if git diff --quiet; then
            echo "The manifests are already at $VERSION."
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      # The same app as auto-release: a push with GITHUB_TOKEN cannot reach a
      # protected main.
      - name: Mint the releaser app token
        if: steps.bump.outputs.version != ''
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Open the bump as a pull request
        if: steps.bump.outputs.version != ''
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/plugin-manifests
          title: "chore(plugins): sync manifest versions to ${{ steps.bump.outputs.version }}"
          commit-message: "chore(plugins): sync manifest versions to ${{ steps.bump.outputs.version }}"
          delete-branch: true
          body: Sets the plugin manifests to the version of the `v${{ steps.bump.outputs.version }}` release.

      # As spec-sync: the workflow token approves, the app merges once the
      # required checks pass.
      - name: Merge automatically once checks pass
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APPROVER_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          GH_TOKEN="$APPROVER_TOKEN" gh pr review "$PR" --approve --body "Manifest versions match the release tag."
          gh pr merge "$PR" --auto --squash
