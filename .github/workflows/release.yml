name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dev follows every release automatically; prod is promoted by hand from
  # promote.yml. The tag is the version, with the leading v stripped to match
  # the image goreleaser pushes.
  deploy-dev:
    needs: goreleaser
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ovh-dev
      overlay: ovh-dev
      image_tag: ${{ needs.goreleaser.outputs.version }}
      hostname: mcp.dev.skycloak.io
    secrets:
      DEPLOY_KUBECONFIG: ${{ secrets.OVH_KUBECONFIG }}

  publish-registry:
    name: publish to the MCP registry
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      # The tag is the single source of truth. Publishing a version that does not
      # match it is the one failure mode worth engineering out, and it costs a line.
      - name: Pin server.json to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "publishing version $VERSION"

      - name: Validate
        run: ./mcp-publisher validate server.json

      # OIDC only authenticates the io.github.* namespace. This server is
      # io.skycloak/*, which is DNS-verified, so CI signs with the same Ed25519
      # key whose public half is the TXT record on the skycloak.io apex.
      - name: Authenticate
        run: ./mcp-publisher login dns --domain skycloak.io --private-key "$MCP_DNS_PRIVATE_KEY"
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}

      - name: Publish
        run: ./mcp-publisher publish
