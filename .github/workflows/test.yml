name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install oasdiff
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/oasdiff/oasdiff@v1.41.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test the release scripts
        run: |
          bash scripts/release/next-version_test.sh
          bash scripts/release/resolve-spec-ref_test.sh
          bash scripts/release/filter-spec_test.sh
          bash scripts/release/check-breaking_test.sh
      - name: Shellcheck the release scripts
        run: shellcheck scripts/release/*.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...

  docker-stdio:
    name: container speaks stdio uncredentialed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t skycloak-mcp:ci .
      # Server directories (Glama and the ones that follow it) build this image
      # and introspect it with no credentials. A build that cannot answer
      # tools/list there is listed with no tools and no quality score.
      - name: initialize + tools/list with no credentials
        run: scripts/docker-stdio-smoke.sh skycloak-mcp:ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Check the generated API client is in sync with openapi.yaml
        run: |
          go generate ./internal/apiclient/...
          git diff --exit-code internal/apiclient

  server-json:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The registry rejects an over-long description at publish time, which means
      # a tag that builds a release and an image and then fails after both. Catch
      # it on the pull request instead.
      - name: Validate against the registry
        run: |
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
