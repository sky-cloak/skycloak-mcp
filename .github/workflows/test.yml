name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Check the generated API client is in sync with openapi.yaml
        run: |
          go generate ./internal/apiclient/...
          git diff --exit-code internal/apiclient

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      # A manifest that does not build is only discovered at deploy time
      # otherwise, which is after a release has already been cut.
      - name: Build every overlay
        run: |
          set -euo pipefail
          for overlay in config/overlays/*/; do
            echo "== $overlay"
            kustomize build "$overlay" > /dev/null
          done
      # The overlays exist to differ. If one ever stops setting its own
      # endpoints, it silently points an environment at the other one's.
      - name: Each overlay points at its own environment
        run: |
          set -euo pipefail
          kustomize build config/overlays/ovh-dev | grep -q 'https://api.dev.skycloak.io'
          kustomize build config/overlays/ovh-dev | grep -q 'mcp.dev.skycloak.io'
          kustomize build config/overlays/azure-prod-us | grep -q 'https://api.skycloak.io'
          kustomize build config/overlays/azure-prod-us | grep -q 'mcp.skycloak.io'
          if kustomize build config/overlays/azure-prod-us | grep -q 'dev.skycloak.io'; then
            echo "::error::the prod overlay references a dev hostname"; exit 1
          fi
          if kustomize build config/overlays/ovh-dev | grep -q 'placeholder'; then
            echo "::error::the dev overlay left a base placeholder unset"; exit 1
          fi

  server-json:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The registry rejects an over-long description at publish time, which means
      # a tag that builds a release and an image and then fails after both. Catch
      # it on the pull request instead.
      - name: Validate against the registry
        run: |
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
