        so the console can show a change before it is saved. The sign-in engine of the tenant's
        region renders it, with the email copy the engine fixes and the tenant's current logo: the
        draft's `logoUrl` is ignored, as a replacement ignores it. A draft a replacement would
        refuse answers 400 naming the field. When the engine cannot be reached the preview answers
        `503 engine_unavailable`. A tenant of another workspace, or a deleted one, answers 404. The
        answer is a whole HTML document, sent with a policy that sandboxes it: show it in a
        sandboxed frame, never in the console's own page.
