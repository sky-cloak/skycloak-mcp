security:
  - BearerAuth: []
components:
  parameters:
    AppPageParameters.cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page; absent for the first page.
      schema:
        type: string
      explode: false
    AppPageParameters.limit:
      name: limit
      in: query
      required: false
      description: The most apps to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
    PageParameters.cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page; absent for the first page.
      schema:
        type: string
      explode: false
    PageParameters.limit:
      name: limit
      in: query
      required: false
      description: The most items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      explode: false
  schemas:
    AddCustomDomain:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
          description: |-
            The domain, such as `login.example.com`: two labels or more, at most 230 characters, ASCII
            (an internationalized domain in its `xn--` form), and not a Skycloak address. It is stored
            lowercase, with no trailing dot, and never changes. Another tenant's domain cannot be
            added.
      description: What adding a tenant's custom domain takes.
    ApiKey:
      type: object
      required:
        - id
        - workspaceId
        - name
        - prefix
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the key is for, as the console shows it.
        prefix:
          type: string
          description: The first characters of the secret, to tell keys apart.
          readOnly: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: |-
            What the key may do. Left out when creating a key, it is every read scope; answers always
            carry it.
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The one tenant the key may act on; absent when it covers the whole workspace.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops working; absent when it never expires.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        lastUsedAt:
          type: string
          format: date-time
          description: When the key last called the API; absent if it never has.
          readOnly: true
      description: An API key a workspace uses to call this API. Its secret is shown only once.
    ApiKeyPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    ApiKeyScope:
      type: object
      required:
        - scope
        - description
        - ownerOnly
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        description:
          type: string
          description: What the scope lets a key do, in one sentence.
        ownerOnly:
          type: boolean
          description: Whether only an Owner grants it, when creating a key; no default or write scope holds it.
      description: One scope a key may hold, as the console offers it when a key is created.
    ApiKeyScopeList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          description: The scopes, in the order of the Scope enum.
      description: Every scope an API key may hold.
    ApiKeyWithSecret:
      type: object
      required:
        - id
        - workspaceId
        - name
        - prefix
        - createdAt
        - secret
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the key is for, as the console shows it.
        prefix:
          type: string
          description: The first characters of the secret, to tell keys apart.
          readOnly: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: |-
            What the key may do. Left out when creating a key, it is every read scope; answers always
            carry it.
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The one tenant the key may act on; absent when it covers the whole workspace.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops working; absent when it never expires.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        lastUsedAt:
          type: string
          format: date-time
          description: When the key last called the API; absent if it never has.
          readOnly: true
        secret:
          type: string
          description: The secret, sent as a bearer token. It is never shown again.
          readOnly: true
      description: An API key with its secret, answered only when the key is created or rotated.
    App:
      type: object
      required:
        - id
        - tenantId
        - name
        - clientId
        - clientType
        - grantTypes
        - redirectUris
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The app's name, shown to users on the sign-in page.
        clientId:
          type: string
          description: The OAuth client ID the app sends to the tenant's address.
          readOnly: true
        clientType:
          allOf:
            - $ref: '#/components/schemas/ClientType'
          description: Whether the app holds a client secret. Fixed when the app is created.
        grantTypes:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
          description: The grants the app may use.
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: The exact addresses the tenant may send users back to after sign-in.
        postLogoutRedirectUris:
          type: array
          items:
            type: string
            format: uri
          description: The exact addresses the tenant may send users back to after sign-out.
        requirePar:
          type: boolean
          description: Whether the tenant refuses an authorization request the app did not first push to its pushed authorization request endpoint (RFC 9126).
          default: false
        requireDpop:
          type: boolean
          description: Whether the tenant refuses a token request from the app without a DPoP proof (RFC 9449), so its tokens are bound to the proof's key.
          default: false
        allowedResources:
          type: array
          items:
            type: string
            format: uri
          description: 'The resource indicators (RFC 8707) the app may ask tokens for: absolute URIs with no fragment, each listed once. Empty allows none.'
          default: []
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: An OIDC and OAuth 2.1 application registered in a tenant.
    AppMergePatchUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The app's name, shown to users on the sign-in page.
        grantTypes:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
          description: The grants the app may use.
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: The exact addresses the tenant may send users back to after sign-in.
        postLogoutRedirectUris:
          type: array
          items:
            type: string
            format: uri
          nullable: true
          description: The exact addresses the tenant may send users back to after sign-out.
        requirePar:
          type: boolean
          nullable: true
          description: Whether the tenant refuses an authorization request the app did not first push to its pushed authorization request endpoint (RFC 9126).
        requireDpop:
          type: boolean
          nullable: true
          description: Whether the tenant refuses a token request from the app without a DPoP proof (RFC 9449), so its tokens are bound to the proof's key.
        allowedResources:
          type: array
          items:
            type: string
            format: uri
          nullable: true
          description: 'The resource indicators (RFC 8707) the app may ask tokens for: absolute URIs with no fragment, each listed once. Empty allows none.'
      description: An OIDC and OAuth 2.1 application registered in a tenant.
    AppPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
          description: The apps on this page, newest first.
        nextCursor:
          type: string
          description: Set when more apps follow; absent on the last page.
      description: A page of a tenant's apps, newest first. Pass `nextCursor` back as `cursor` to read the next page.
    AppWithSecret:
      type: object
      required:
        - id
        - tenantId
        - name
        - clientId
        - clientType
        - grantTypes
        - redirectUris
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The app's name, shown to users on the sign-in page.
        clientId:
          type: string
          description: The OAuth client ID the app sends to the tenant's address.
          readOnly: true
        clientType:
          allOf:
            - $ref: '#/components/schemas/ClientType'
          description: Whether the app holds a client secret. Fixed when the app is created.
        grantTypes:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
          description: The grants the app may use.
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: The exact addresses the tenant may send users back to after sign-in.
        postLogoutRedirectUris:
          type: array
          items:
            type: string
            format: uri
          description: The exact addresses the tenant may send users back to after sign-out.
        requirePar:
          type: boolean
          description: Whether the tenant refuses an authorization request the app did not first push to its pushed authorization request endpoint (RFC 9126).
          default: false
        requireDpop:
          type: boolean
          description: Whether the tenant refuses a token request from the app without a DPoP proof (RFC 9449), so its tokens are bound to the proof's key.
          default: false
        allowedResources:
          type: array
          items:
            type: string
            format: uri
          description: 'The resource indicators (RFC 8707) the app may ask tokens for: absolute URIs with no fragment, each listed once. Empty allows none.'
          default: []
        createdAt:
          type: string
          format: date-time
          readOnly: true
        clientSecret:
          type: string
          description: The client secret, absent for a public app. It is never shown again.
          readOnly: true
      description: An app with its client secret, answered only when it is created or its secret rotated.
    AuditActor:
      type: object
      required:
        - type
        - name
      properties:
        type:
          $ref: '#/components/schemas/AuditActorType'
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The person's or the key's ID; absent for a platform job.
        name:
          type: string
          description: The person's email address, the key's name or the job's name.
      description: 'Who did what an audit event records: exactly one person, API key or platform job.'
    AuditActorType:
      type: string
      enum:
        - person
        - api_key
        - system
      description: Who acted.
    AuditDelivery:
      type: object
      required:
        - url
        - createdAt
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: The HTTPS address events are sent to.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        lastDeliveredAt:
          type: string
          format: date-time
          description: When an event last reached the address; absent when none has yet.
          readOnly: true
      description: |-
        Where a workspace's audit events are sent as they happen: one HTTPS address of the
        customer's own system. Each event is sent as JSON, signed with the delivery's signing secret
        so the system can check it came from Skycloak.
    AuditDeliveryTest:
      type: object
      required:
        - delivered
        - at
      properties:
        delivered:
          type: boolean
          description: The address answered with a 2xx status.
        status:
          type: integer
          format: int32
          description: The HTTP status the address answered; absent when it could not be reached.
        at:
          type: string
          format: date-time
          description: When the test event was sent.
      description: How a test event sent to the delivery's address went.
    AuditDeliveryWithSecret:
      type: object
      required:
        - url
        - createdAt
        - signingSecret
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: The HTTPS address events are sent to.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        lastDeliveredAt:
          type: string
          format: date-time
          description: When an event last reached the address; absent when none has yet.
          readOnly: true
        signingSecret:
          type: string
          description: The secret events are signed with. It is never shown again.
          readOnly: true
      description: An audit delivery with its signing secret, answered only when the delivery is set up.
    AuditEvent:
      type: object
      required:
        - id
        - at
        - actor
        - action
        - target
        - outcome
      properties:
        id:
          $ref: '#/components/schemas/Id'
        at:
          type: string
          format: date-time
          description: When it happened.
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: What was done, as `{resource}.{verb}`, for example `apps.create`.
        target:
          type: string
          description: The ID of what was acted on.
        targetName:
          type: string
          description: The name of what was acted on when it has one, as it was then.
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The tenant acted on; absent when the act concerns the whole workspace.
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
      description: |-
        One act in the workspace, kept for audit: who did what to which resource, and when. An event
        never holds a secret, a token or key material.
    AuditEventPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
          description: The events on this page, newest first.
        nextCursor:
          type: string
          description: Set when older events follow; absent on the last page.
      description: A page of audit events, newest first. Pass `nextCursor` back as `cursor` for older ones.
    AuditOutcome:
      type: string
      enum:
        - succeeded
        - refused
        - failed
      description: How an audited act ended.
    Branding:
      type: object
      required:
        - primaryColor
        - accentColor
        - backgroundColor
        - textColor
        - font
        - links
        - updatedAt
      properties:
        logoUrl:
          type: string
          format: uri
          description: |-
            The address the tenant's uploaded logo is served on, on the tenant's own sign-in address;
            absent when it has none. Only the logo upload sets it, and a replacement of the branding
            keeps it.
          readOnly: true
        primaryColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: 'The color of buttons and links, as `#` and six hex digits: `#1d64f2` by default.'
        accentColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: 'The color of highlights and focus rings, as `#` and six hex digits: `#1d64f2` by default.'
        backgroundColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: "The page's background color, as `#` and six hex digits: `#ffffff` by default."
        textColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: 'The color of text, as `#` and six hex digits: `#18181b` by default.'
        font:
          allOf:
            - $ref: '#/components/schemas/Font'
          description: '`system` by default.'
        productName:
          type: string
          maxLength: 60
          description: |-
            The name of the tenant's product, shown on the page and in the emails, at most 60
            characters; absent by default. Absent, or only spaces, the branding has none.
        links:
          type: array
          items:
            $ref: '#/components/schemas/BrandingLink'
          maxItems: 5
          description: The links shown at the foot of the page and the emails, at most five; none by default.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        How a tenant's hosted sign-in page and its code, reset and invite emails look. A tenant has
        one branding and no draft: a replacement is what the page and the emails show from then on. A
        tenant that never set it has the defaults each field names.
    BrandingLink:
      type: object
      required:
        - label
        - url
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: The link's text, from 1 to 40 characters.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: 'Where it leads: an `https` address of at most 2048 characters, with no user or password.'
      description: A link at the foot of a tenant's hosted page and emails, such as its terms or its support.
    BrandingPreview:
      type: object
      required:
        - target
        - branding
      properties:
        target:
          $ref: '#/components/schemas/PreviewTarget'
        branding:
          allOf:
            - $ref: '#/components/schemas/Branding'
          description: 'The draft: every field a replacement takes, as it takes them.'
      description: 'A preview to render: what, and with which draft branding.'
    ClientType:
      type: string
      enum:
        - confidential
        - public
      description: Whether an app can keep a secret.
    ConnectionStatus:
      type: string
      enum:
        - connected
        - pending
        - not_set_up
      description: How far an organization's company sign-in (SSO) or automatic user sync (SCIM) has come.
    Credential:
      type: object
      required:
        - id
        - type
        - label
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/CredentialType'
        label:
          type: string
          description: The name the user gave it; empty when they gave none.
        rpId:
          type: string
          description: |-
            For a passkey, the address it signs in on (its WebAuthn relying party ID): the tenant's
            sign-in address or one of its verified domains.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: When it was last used, an authenticator's confirming code included; absent when it never was.
      description: |-
        One of a user's second factors: a passkey or a confirmed authenticator. Its key or secret is
        never read through this API.
    CredentialList:
      type: object
      required:
        - items
        - recoveryCodesLeft
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
          description: The user's passkeys and confirmed authenticators, oldest first.
        recoveryCodesLeft:
          type: integer
          format: int32
          description: How many of the user's recovery codes are not yet used.
      description: A user's second factors and how many of their recovery codes are left.
    CredentialType:
      type: string
      enum:
        - passkey
        - authenticator
      description: What kind of second factor a credential is.
    CustomDomain:
      type: object
      required:
        - id
        - hostname
        - status
        - records
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        hostname:
          type: string
          description: |-
            The domain, such as `login.example.com`: two labels or more, at most 230 characters, ASCII
            (an internationalized domain in its `xn--` form), and not a Skycloak address. It is stored
            lowercase, with no trailing dot, and never changes.
        status:
          allOf:
            - $ref: '#/components/schemas/CustomDomainStatus'
          readOnly: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
          description: The CNAME record, then the TXT record.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        checkedAt:
          type: string
          format: date-time
          description: When its records were last looked up; absent when they never were.
          readOnly: true
        verifiedAt:
          type: string
          format: date-time
          description: When it was verified; absent unless it is.
          readOnly: true
      description: |-
        One of a tenant's own domains. Adding it answers the two DNS records that verify it: a CNAME
        from the domain to the tenant's sign-in address, and a TXT record holding a token of the
        domain's own that proves who added it. A verified domain is not yet served: its sign-in page
        answers there once certificates are issued for it.
    CustomDomainList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomDomain'
          description: Every custom domain of the tenant, oldest first.
      description: A tenant's custom domains.
    CustomDomainStatus:
      type: string
      enum:
        - pending
        - verified
        - failed
      description: Where a custom domain stands in its verification.
    DnsRecord:
      type: object
      required:
        - type
        - name
        - value
      properties:
        type:
          $ref: '#/components/schemas/DnsRecordType'
        name:
          type: string
          description: "The record's name: the full name, with no trailing dot."
        value:
          type: string
          description: The record's value.
      description: A DNS record the owner of a custom domain sets at their DNS provider.
    DnsRecordType:
      type: string
      enum:
        - CNAME
        - TXT
      description: The type of a DNS record to set.
    DomainRecord:
      type: object
      required:
        - type
        - name
        - value
      properties:
        type:
          type: string
          enum:
            - TXT
          description: 'The record type: always `TXT`.'
        name:
          type: string
          description: The name to publish the record at.
        value:
          type: string
          description: The value the record must hold.
      description: A DNS record to publish.
    Environment:
      type: string
      enum:
        - production
        - staging
        - development
      description: |-
        What a tenant is for. A label only: limits and billing treat every environment alike, and
        changing it never changes the tenant's address.
    Error:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - message
      properties:
        type:
          type: string
          description: "`about:blank`: `code` gives the reason and `title` is the status's own phrase."
        title:
          type: string
          description: The HTTP status's phrase, for example `Bad Request`.
        status:
          type: integer
          format: int32
          description: The HTTP status.
        detail:
          type: string
          description: A sentence for people, which may change; the same as `message`.
        code:
          type: string
          description: A stable, machine-readable reason, for example `not_found`.
        message:
          type: string
          description: A sentence for people, which may change.
        field:
          type: string
          description: |-
            The field of the request that was refused, as the API names it, for example `primaryColor`
            or `links[2].url`; absent when the error is not about one field.
      description: |-
        Why a request failed: an RFC 9457 problem, with `code`, `message` and `field` as its extension
        members.
    FirstLoginReport:
      type: object
      required:
        - since
        - signedUp
        - firstLogins
        - underFiveMinutes
        - recent
      properties:
        since:
          type: string
          format: date-time
          description: The earliest sign-up counted.
        signedUp:
          type: integer
          format: int32
          description: Workspaces that signed up.
        firstLogins:
          type: integer
          format: int32
          description: Of them, those that had a first test login.
        underFiveMinutes:
          type: integer
          format: int32
          description: Of them, those whose first test login came less than five minutes after the sign-up.
        medianMinutes:
          type: number
          description: The median minutes to a first test login; absent when none has come.
        recent:
          type: array
          items:
            $ref: '#/components/schemas/FirstLoginTime'
          description: The latest sign-ups, newest first, at most 100.
      description: |-
        Sign-up to first test login over the workspaces that signed up since a time, from the two
        times each workspace keeps.
    FirstLoginTime:
      type: object
      required:
        - workspaceId
        - signedUpAt
      properties:
        workspaceId:
          $ref: '#/components/schemas/Id'
        signedUpAt:
          type: string
          format: date-time
          description: When the person whose first sign-in made the workspace signed up.
        firstTestLoginAt:
          type: string
          format: date-time
          description: When the engine issued the workspace's first real token; absent until it has.
        minutes:
          type: number
          description: Minutes from the sign-up to the first test login; absent until it has come.
      description: One workspace's time from its sign-up to its first test login.
    FirstRun:
      type: object
      required:
        - workspaceId
        - tenantId
        - projectName
        - region
        - address
        - issuer
        - appId
        - clientId
        - redirectUri
      properties:
        workspaceId:
          $ref: '#/components/schemas/Id'
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: 'The first project: a development tenant in the US region.'
        projectName:
          type: string
          description: The project's display name, the workspace's name when it was made.
        region:
          $ref: '#/components/schemas/Region'
        address:
          type: string
          description: The project's sign-in address.
        issuer:
          type: string
          format: uri
          description: The project's token issuer.
        appId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: "The project's default app: public, with PKCE required and redirect addresses on localhost."
        clientId:
          type: string
          description: The client ID the default app sends. It has no secret.
        redirectUri:
          type: string
          format: uri
          description: The redirect address the snippets use, one of the default app's.
        testUser:
          allOf:
            - $ref: '#/components/schemas/TestUser'
          description: The test user to sign in with; absent once it is deleted.
      description: |-
        What a workspace's first project needs to add sign-in to an app: made with the workspace by
        the first sign-in of the person who signed up, with no question asked. It never holds an API
        key or a client secret.
    FirstTestLogin:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
          description: Whether the first login has come.
        receivedAt:
          type: string
          format: date-time
          description: When the engine issued the first real token, the workspace's first test login; absent until it has.
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The first project; absent once it is deleted.
        user:
          allOf:
            - $ref: '#/components/schemas/FirstTestLoginUser'
          description: Who signed in; absent until the first login, and once that user is deleted.
      description: |-
        Whether the workspace's first project has issued its first real token: the first time an app
        of the project exchanged an authorization code for tokens. Once received it stays received.
    FirstTestLoginUser:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          description: The user's email address, absent for a user who signs in another way.
      description: The user whose sign-in was the first project's first login.
    Font:
      type: string
      enum:
        - system
        - inter
        - roboto
        - lato
        - montserrat
        - merriweather
      description: |-
        The typeface of a tenant's hosted pages and emails. Each is bundled with the sign-in engine,
        so the hosted page loads no font from another origin.
    GrantType:
      type: string
      enum:
        - authorization_code
        - refresh_token
        - client_credentials
      description: An OAuth 2.1 grant an app may use.
    Id:
      type: string
      format: uuid
      description: A resource's identifier, assigned by the platform.
    Invitation:
      type: object
      required:
        - id
        - email
        - role
        - createdAt
        - expiresAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          maxLength: 254
          description: The teammate's email address.
        role:
          allOf:
            - $ref: '#/components/schemas/InvitationRole'
          description: The chosen team role, or viewer for legacy invitations without a chosen role.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When it was sent, or last sent again.
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: 'After this it can no longer be accepted: 14 days after it was sent.'
          readOnly: true
      description: |-
        An invitation for a teammate to join the workspace. It is accepted on the teammate's next
        sign-in to the console with the invited email address verified, which makes them a member.
    InvitationRole:
      type: string
      enum:
        - owner
        - admin
        - member
        - viewer
      description: Team invitation roles, including the legacy read-only role.
    IpRule:
      type: object
      required:
        - id
        - action
        - cidr
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        action:
          $ref: '#/components/schemas/IpRuleAction'
        cidr:
          type: string
          maxLength: 43
          pattern: ^[0-9A-Fa-f:.]+/[0-9]{1,3}$
          description: |-
            The addresses covered, as an IPv4 or IPv6 range in CIDR notation, such as `203.0.113.0/24`.
            A single address is a `/32` or a `/128`. The pattern is the shape only; a range whose address
            or prefix length is out of bounds still answers 400.
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A rule on which network addresses may sign in to a tenant. Rules are optional: a tenant with
        none lets every address sign in. With one allow rule or more, only the addresses they cover
        may; a deny rule refuses the addresses it covers whatever the allow rules say.
    IpRuleAction:
      type: string
      enum:
        - allow
        - deny
      description: What an IP rule does with the addresses it covers.
    IpRulePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    KeycloakCredential:
      type: object
      required:
        - type
        - secretData
        - credentialData
      properties:
        id:
          type: string
          description: The credential's ID in Keycloak.
        userLabel:
          type: string
          description: The credential's label in Keycloak.
        createdDate:
          type: integer
          format: int64
          description: When Keycloak created the credential, in milliseconds since 1970.
        priority:
          type: integer
          format: int32
          description: The credential's priority in Keycloak.
        type:
          type: string
          enum:
            - password
          description: Always `password`.
        secretData:
          type: string
          description: "A JSON document in a string: the hash's `value` and `salt`, in base64."
        credentialData:
          type: string
          description: 'A JSON document in a string: `hashIterations`, `algorithm` and `additionalParameters`.'
      description: |-
        A password credential of a Keycloak realm export. Only `type`, `secretData` and
        `credentialData` are read; the others the export writes may be sent and are ignored.
    ManagedCustomDomain:
      type: object
      required:
        - hostname
        - ownershipStatus
        - tlsStatus
        - records
        - ready
        - active
        - createdAt
      properties:
        hostname:
          type: string
          description: |-
            The domain, such as `login.example.com`: two labels or more, at most 230 characters, ASCII
            (an internationalized domain in its `xn--` form), and not a Skycloak address. It is stored
            lowercase, with no trailing dot, and never changes. Another tenant's domain cannot be
            added.
        ownershipStatus:
          type: string
          description: |-
            Where the ownership check stands, in Cloudflare's words: `pending` while its TXT record is
            not found, `active` once it is, anything else a failure described by `verificationError`.
          readOnly: true
        tlsStatus:
          type: string
          description: |-
            Where the certificate stands, in Cloudflare's words: `pending` while one is being issued,
            `active` once it is deployed, anything else a failure described by `verificationError`.
          readOnly: true
        verificationError:
          type: string
          description: What Cloudflare last said about a step that failed; absent when none did.
          readOnly: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
          description: |-
            The CNAME record, then the TXT record. Empty until Cloudflare has answered with the
            ownership record, which happens as the domain is added.
          readOnly: true
        ready:
          type: boolean
          description: Whether the ownership and the certificate are both active, so the domain can be activated.
          readOnly: true
        active:
          type: boolean
          description: Whether the domain has been activated, so it serves.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        checkedAt:
          type: string
          format: date-time
          description: When Cloudflare was last asked about the domain; absent when it never was.
          readOnly: true
        activatedAt:
          type: string
          format: date-time
          description: When the domain was activated; absent unless it is active.
          readOnly: true
        deactivateAt:
          type: string
          format: date-time
          description: |-
            When the domain stops serving because the workspace dropped to a plan without a custom
            domain; absent when none is scheduled. The record is kept, and an upgrade cancels it.
          readOnly: true
      description: |-
        A tenant's one custom domain, served through Cloudflare for SaaS beside the tenant's
        permanent address. Adding it answers the two DNS records to publish: a CNAME from the domain
        to `skycloak-dns.io` and a TXT record that proves who owns it. It serves nothing until the
        tenant's admin activates it, which is refused until both the ownership and the certificate
        are active. Once active it is a sign-in address of its own, with itself as the issuer.
    McpProtectedResourceMetadata:
      type: object
      required:
        - resource
        - resource_name
        - authorization_servers
        - scopes_supported
      properties:
        resource:
          type: string
          format: uri
        resource_name:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
            format: uri
        scopes_supported:
          type: array
          items:
            type: string
      description: An RFC 9728 document to publish on the tenant's own MCP resource server.
    McpRegistrationPolicy:
      type: object
      required:
        - dynamicRegistration
        - clientIdMetadataDocuments
      properties:
        dynamicRegistration:
          type: boolean
        clientIdMetadataDocuments:
          type: boolean
      description: Independent permissions for MCP client registration. Both default to off on every tier.
    McpServer:
      type: object
      required:
        - id
        - url
        - name
        - scopes
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 2000
          description: Exact HTTPS resource identifier, without user information or a fragment. Unique in this tenant.
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
          maxItems: 100
          description: Distinct OAuth scope tokens, each 1 to 256 ASCII characters.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A declared MCP protected resource, stored in the tenant's region.
    McpServerMergePatchUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
          description: Exact HTTPS resource identifier, without user information or a fragment. Unique in this tenant.
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
          maxItems: 100
          description: Distinct OAuth scope tokens, each 1 to 256 ASCII characters.
      description: A declared MCP protected resource, stored in the tenant's region.
    McpServerPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpServer'
        nextCursor:
          type: string
      description: A page of MCP servers, ordered by ID.
    MemberRoleChange:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
    MfaPolicy:
      type: object
      required:
        - policy
        - updatedAt
      properties:
        policy:
          $ref: '#/components/schemas/TwoStep'
        updatedAt:
          type: string
          format: date-time
          description: When the tenant's sign-in settings last changed.
          readOnly: true
      description: |-
        A tenant's MFA policy. It is the tenant's `twoStep` setting, read and changed on its own, so
        changing it leaves every other sign-in setting as it is.
    NewAuditDelivery:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: The HTTPS address events are sent to.
      description: What the console sends to set up or move audit delivery.
    NewInvitation:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
          description: The teammate's email address, one plain address such as `sam@acme.example`.
        role:
          allOf:
            - $ref: '#/components/schemas/TeamRole'
          description: |-
            Chosen team role. Omission preserves the legacy read-only invitation. Only Owners invite
            Owners. Mock server only for now: the live endpoint does not take it yet and answers 400 to a
            body that carries it.
      description: What the console sends to invite a teammate.
    NewOrganization:
      type: object
      required:
        - tenantId
        - name
      properties:
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: |-
            The tenant the organization's staff sign in to, one of the workspace's. A create without one
            answers 400; a tenant that is not one of the workspace's answers 404.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
        domains:
          type: array
          items:
            type: string
          description: |-
            Domains to add, each unverified until the organization proves it holds it. Each is trimmed
            and lowercased, then must be a domain as `OrganizationDomain.name` takes one, or the create
            answers 400; a domain named twice is added once.
      description: 'What a create sends: the tenant, the name and any domains to verify.'
    NewOrganizationDomain:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 253
          description: |-
            The domain, trimmed and lowercased, which must be a domain as `OrganizationDomain.name` takes
            one, or the add answers 400.
      description: 'What adding a domain sends: its name.'
    NewOrganizationInvitation:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: The address to email the link to. Trimmed and lowercased.
        role:
          $ref: '#/components/schemas/OrganizationRole'
      description: 'What creating an invitation sends: the address to invite and the role the person gets.'
    NewOrganizationMember:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The user to add. A user the tenant does not have answers 404.
        role:
          $ref: '#/components/schemas/OrganizationRole'
      description: 'What adding a member sends: an existing user of the tenant and the role they get.'
    NewTenantOrganization:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
        domains:
          type: array
          items:
            type: string
          description: |-
            Domains to add, each unverified until the organization proves it holds it. Each is trimmed
            and lowercased, then must be a domain as `OrganizationDomain.name` takes one, or the create
            answers 400; a domain named twice is added once.
      description: 'What a create under a tenant sends: the name and any domains to verify.'
    NewWorkspace:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The company's name, as the console shows it.
      description: What the console sends to create a workspace.
    Organization:
      type: object
      required:
        - id
        - workspaceId
        - tenantId
        - name
        - domains
        - sso
        - scim
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The tenant the organization's staff sign in to. Fixed when the organization is created.
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationDomain'
          description: The organization's domains, in the order they were added.
          readOnly: true
        sso:
          allOf:
            - $ref: '#/components/schemas/SsoConnection'
          readOnly: true
        scim:
          allOf:
            - $ref: '#/components/schemas/ScimConnection'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        An organization: one business customer of a tenant, whose staff sign in to that tenant's apps.
        Its IT admin connects company sign-in (SSO) and automatic user sync (SCIM) through a setup link.
    OrganizationChange:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's name, shown to its staff on the sign-in page.
      description: 'What an update sends: the new name, the only part of an organization that changes.'
    OrganizationDomain:
      type: object
      required:
        - name
        - verified
      properties:
        name:
          type: string
          maxLength: 253
          pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
          description: The domain, lowercase, for example `globex.example`.
        verified:
          type: boolean
          description: Whether the organization proved it holds the domain, with a DNS record its setup link asks for.
        verifiedAt:
          type: string
          format: date-time
          description: When it was verified; absent while it is not.
        dnsRecord:
          allOf:
            - $ref: '#/components/schemas/DomainRecord'
          description: |-
            The DNS TXT record that proves the organization holds the domain; absent once it is verified.
            Publish it, then verify the domain.
      description: A domain an organization's staff have email addresses at.
    OrganizationInvitation:
      type: object
      required:
        - id
        - organizationId
        - email
        - role
        - createdAt
        - expiresAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          maxLength: 254
          format: email
          description: The invited address, lowercase. Only a person signed in with this verified email address can accept.
        role:
          allOf:
            - $ref: '#/components/schemas/OrganizationRole'
          description: The role the person gets on joining.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: 'After this the link no longer opens: 7 days after the invitation was made.'
          readOnly: true
      description: |-
        An offer to join an organization with a role, made to one email address. It is pending until
        the person accepts it, it is revoked or it expires. Its single-use token is only in the email
        and is never part of the API.
    OrganizationInvitationPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationInvitation'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    OrganizationMember:
      type: object
      required:
        - userId
        - role
        - createdAt
      properties:
        userId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          format: email
          description: The user's email address; absent when the user has none.
          readOnly: true
        displayName:
          type: string
          description: The user's name for people; absent when the user has none.
          readOnly: true
        role:
          $ref: '#/components/schemas/OrganizationRole'
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A user of the tenant in an organization, with the one role the tenant's apps authorize them
        on. Owner, admin and member are labels for apps; they give no access to this API.
    OrganizationMemberChange:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/OrganizationRole'
      description: 'What changing a member sends: the role that replaces theirs.'
    OrganizationMemberPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    OrganizationPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    OrganizationRole:
      type: string
      enum:
        - owner
        - admin
        - member
      description: 'What an organization is to a person: the one role their membership has.'
    PasswordHash:
      type: object
      properties:
        keycloak:
          allOf:
            - $ref: '#/components/schemas/KeycloakCredential'
          description: |-
            One password credential of a Keycloak realm export, as the export writes it under the
            user's `credentials`, hashed with argon2 (argon2id), pbkdf2, pbkdf2-sha256 or
            pbkdf2-sha512.
        auth0:
          type: string
          minLength: 1
          description: A bcrypt hash from an Auth0 export, starting `$2a$` or `$2b$`.
      description: |-
        A password hash from another identity provider. Exactly one of `keycloak` and `auth0` is
        set. It is stored as it is, only ever checked against, and replaced with argon2id the next
        time its user signs in with it.
    PreviewTarget:
      type: string
      enum:
        - page
        - email_code
        - email_reset
        - email_invite
      description: What a branding preview renders.
    Readiness:
      type: object
      required:
        - checks
        - region
        - checkedAt
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
          description: Every check, once each, in the order of `ReadinessCheckId`.
        region:
          allOf:
            - $ref: '#/components/schemas/Region'
          description: The tenant's region, which the `data_region` check names.
        checkedAt:
          type: string
          format: date-time
          description: When the checks were read.
      description: |-
        A tenant's readiness for a buyer's security review: each check, on or off as the tenant
        stands now, read from its settings, organizations, IP rules and the workspace's audit
        delivery. It changes nothing; each check's own settings turn it on.
    ReadinessCheck:
      type: object
      required:
        - id
        - state
      properties:
        id:
          $ref: '#/components/schemas/ReadinessCheckId'
        state:
          $ref: '#/components/schemas/ReadinessState'
      description: One check of a tenant's readiness and where it stands.
    ReadinessCheckId:
      type: string
      enum:
        - sso
        - scim
        - two_step_required
        - passkeys
        - breached_password_check
        - audit_delivery
        - session_limits
        - data_region
        - ip_rules
      description: |-
        One check of a buyer's security review, in the order a tenant's readiness lists them. Each
        reads state the tenant, its organizations or its workspace already hold.
    ReadinessState:
      type: string
      enum:
        - 'on'
        - 'off'
        - info
      description: Where a readiness check stands.
    RecoveryCodes:
      type: object
      required:
        - codes
      properties:
        codes:
          type: array
          items:
            type: string
          description: The codes, each good for one sign-in. They are stored only hashed and never answered again.
      description: A new set of recovery codes, answered once.
    Region:
      type: string
      enum:
        - us
        - eu
      description: A region the engine runs in. A tenant's region is fixed when it is created.
    Role:
      type: string
      enum:
        - owner
        - admin
        - viewer
      description: A person's role in a workspace, from most to least power.
    ScimConnection:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        lastSyncAt:
          type: string
          format: date-time
          description: When its directory last synced; absent until it has.
      description: The organization's automatic user sync (SCIM) from its own directory.
    Scope:
      type: string
      enum:
        - workspaces:read
        - workspaces:write
        - tenants:read
        - tenants:write
        - tenants:delete
        - apps:read
        - apps:write
        - users:read
        - users:write
        - organizations:read
        - organizations:write
        - settings:read
        - settings:write
        - signing_keys:rotate
      description: |-
        What an API key may do: read or write one kind of resource, or one of the two acts only an
        Owner may grant. A write scope never includes `tenants:delete` or `signing_keys:rotate`.
    Session:
      type: object
      required:
        - email
        - accessToken
        - accessTokenExpiresAt
      properties:
        email:
          type: string
          description: The signed-in person's email address.
        accessToken:
          type: string
          description: |-
            A console access token for this API, sent as a bearer token. Read the session again for a
            new one before it expires.
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: When the access token stops working.
        givenName:
          type: string
          description: The person's first name, which the console greets them by; absent when it is not known.
        newWorkspace:
          allOf:
            - $ref: '#/components/schemas/Workspace'
          description: |-
            The workspace the person's first sign-in made for them, which the console names on Home.
            Present only on the answer to that sign-in.
        newProject:
          allOf:
            - $ref: '#/components/schemas/Tenant'
          description: |-
            The first project the person's first sign-in made in that workspace, a development tenant in
            the US region with a default app, which the console opens. Present only on the answer to
            that sign-in.
      description: |-
        The console session of the person signed in. The session itself is the `session` cookie, set
        HttpOnly, Secure and SameSite=Strict on the console's address; the answer carries a short-lived
        access token for the operations that take a bearer token.
    SessionLimits:
      type: object
      required:
        - maxLifetime
        - idleTimeout
        - recommendedMaxLifetime
        - recommendedIdleTimeout
        - updatedAt
      properties:
        maxLifetime:
          type: integer
          format: int32
          minimum: 3600
          maximum: 36000
          description: 'Seconds a session lasts from its sign-in, however active: 3600 to 36000 (10 hours).'
        idleTimeout:
          type: integer
          format: int32
          minimum: 300
          maximum: 36000
          description: 'Seconds a session lasts with no token issued in it: 300 to 36000, at most `maxLifetime`.'
        recommendedMaxLifetime:
          type: integer
          format: int32
          description: The longest `maxLifetime` Skycloak recommends, in seconds; below 36000, so a lifetime above it can be saved.
          readOnly: true
        recommendedIdleTimeout:
          type: integer
          format: int32
          description: The longest `idleTimeout` Skycloak recommends, in seconds; below 36000, so an idle timeout above it can be saved.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the tenant's sign-in settings last changed.
          readOnly: true
      description: |-
        How long a tenant's sessions last, beside the longest Skycloak recommends for each. The two
        limits are the tenant's `sessionMaxLifetime` and `sessionIdleLifetime` settings, read and
        changed on their own, so changing them leaves every other sign-in setting as it is. A limit
        above its recommended maximum is allowed; the console flags it.
    Settings:
      type: object
      required:
        - passwordEnabled
        - passkeyEnabled
        - emailCodeEnabled
        - twoStep
        - emailSignUp
        - accessTokenLifetime
        - refreshTokenLifetime
        - idTokenLifetime
        - sessionIdleLifetime
        - sessionMaxLifetime
        - updatedAt
      properties:
        passwordEnabled:
          type: boolean
          description: Users may sign in with a password.
        passkeyEnabled:
          type: boolean
          description: Users may sign in with a passkey.
        emailCodeEnabled:
          type: boolean
          description: Users may sign in with a code sent to their email address.
        twoStep:
          $ref: '#/components/schemas/TwoStep'
        emailSignUp:
          type: boolean
          description: People may sign up with their email address on the tenant's sign-in page.
        accessTokenLifetime:
          type: integer
          format: int32
          minimum: 60
          maximum: 3600
          description: 'Seconds an access token is accepted: 60 to 3600, 300 by default.'
        refreshTokenLifetime:
          type: integer
          format: int32
          minimum: 3600
          maximum: 2592000
          description: |-
            Seconds a refresh token works: 3600 to 2592000 (30 days), 604800 (7 days) by default. Each
            refresh replaces it, and none outlives its session.
        idTokenLifetime:
          type: integer
          format: int32
          minimum: 60
          maximum: 3600
          description: 'Seconds an ID token is valid: 60 to 3600, 300 by default.'
        sessionIdleLifetime:
          type: integer
          format: int32
          minimum: 300
          maximum: 36000
          description: |-
            Seconds a session lasts with no token issued in it: 300 to 36000 (10 hours), 1800 by
            default. At most `sessionMaxLifetime`.
        sessionMaxLifetime:
          type: integer
          format: int32
          minimum: 3600
          maximum: 36000
          description: |-
            Seconds a session lasts from its sign-in, however active: 3600 to 36000 (10 hours), the
            longest by default.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        How a tenant's users sign in and sign up, and how long their tokens and sessions live. At
        least one way to sign in stays on. A tenant that never set the lifetimes gets the defaults
        each one names. A new lifetime applies to the next token or session the tenant issues, never
        to one already issued.
    SetupLink:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: The setup page's address. Whoever holds it can set up the organization until it expires.
        expiresAt:
          type: string
          format: date-time
          description: 'After this the link no longer opens: 7 days after it was made.'
        sentTo:
          type: string
          format: email
          description: The address the link was just emailed to; absent when the request named none.
      description: |-
        A setup link: the page where the organization's IT admin verifies its domains and connects
        company sign-in (SSO) and automatic user sync (SCIM) to their own identity provider, with no
        console sign-in of their own.
    SetupLinkRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: The IT admin's email address; absent to answer the link without sending it.
      description: 'What a setup link request sends: an address to email the link to, or nothing.'
    SignInCode:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: The email address the code was sent to.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: |-
            The 6-digit code from the email. It works once, for 10 minutes, and the fifth wrong code
            voids it.
      description: Completes a sign-in with the code emailed to the address.
    SignInCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: |-
            The person's work email address. The same address signs a person in or, the first time,
            signs them up.
      description: Asks for a sign-in code by email.
    SignInEvent:
      type: object
      required:
        - id
        - tenantId
        - region
        - at
        - type
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenantId:
          $ref: '#/components/schemas/Id'
        region:
          type: string
          description: The region the tenant, and so the event, lives in.
        at:
          type: string
          format: date-time
          description: When it happened.
        type:
          $ref: '#/components/schemas/SignInEventType'
        clientId:
          type: string
          description: The OAuth client ID of the app involved; absent when none was.
        userId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The ID of the user involved; absent when none could be told, such as a sign-in for an unknown name.
        ipAddress:
          type: string
          description: The network address the request came from.
        userAgent:
          type: string
          description: The user agent the request came with.
      description: |-
        One event on a tenant's sign-in address, kept for audit. An event never holds a secret or a
        token.
    SignInEventPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SignInEvent'
          description: The events on this page, newest first.
        nextCursor:
          type: string
          description: Set when older events follow; absent on the last page.
      description: A page of a tenant's sign-in events, newest first. Pass `nextCursor` back as `cursor` for older ones.
    SignInEventType:
      type: string
      enum:
        - login
        - login_error
        - logout
        - token_issue
        - token_refresh
        - mfa
        - password_change
      description: A kind of sign-in event a tenant records and a webhook may receive.
    SsoConnection:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        lastSignInAt:
          type: string
          format: date-time
          description: When one of its staff last signed in through it; absent until someone has.
      description: The organization's company sign-in (SSO) connection to its own identity provider.
    TeamRole:
      type: string
      enum:
        - owner
        - admin
        - member
      description: The roles offered by workspace team settings.
    Tenant:
      type: object
      required:
        - id
        - workspaceId
        - name
        - region
        - displayName
        - address
        - issuer
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          description: |-
            The first label of the tenant's address, generated when the tenant is created: a caller
            cannot choose it. Unique within its region, never given to another tenant, and permanent.
          readOnly: true
        region:
          allOf:
            - $ref: '#/components/schemas/Region'
          description: The region the tenant's users live in. Permanent.
        environment:
          allOf:
            - $ref: '#/components/schemas/Environment'
          description: 'What the tenant is for: `development` unless the create names another. It may change after.'
          default: development
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: A name for people, for example "Production".
        address:
          type: string
          description: The tenant's sign-in address, `{name}.{region}.skycloakid.com`. Permanent.
          readOnly: true
        issuer:
          type: string
          format: uri
          description: The tenant's token issuer, `https://{name}.{region}.skycloakid.com`.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A tenant: one isolated sign-in space with its own apps, users and settings, served at
        `{tenant}.{region}.skycloakid.com`. That address is the tenant's token issuer and is
        permanent, so its name and region never change.
    TenantMergePatchUpdate:
      type: object
      properties:
        environment:
          allOf:
            - $ref: '#/components/schemas/Environment'
          nullable: true
          description: 'What the tenant is for: `development` unless the create names another. It may change after.'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: A name for people, for example "Production".
      description: |-
        A tenant: one isolated sign-in space with its own apps, users and settings, served at
        `{tenant}.{region}.skycloakid.com`. That address is the tenant's token issuer and is
        permanent, so its name and region never change.
    TenantPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    TenantUsage:
      type: object
      required:
        - tenantId
        - displayName
        - activeUsers
      properties:
        tenantId:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
        activeUsers:
          type: integer
          format: int32
          minimum: 0
      description: One tenant's distinct users with an interactive sign-in this calendar month.
    TestUser:
      type: object
      required:
        - id
        - username
        - password
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          description: The email address the test user signs in with on the tenant's login page.
        password:
          type: string
          description: The test user's generated password, kept until the test user is deleted.
      description: |-
        The user a workspace's first project is made with, to sign in to the app once without signing
        anyone up. It is marked as a test user: never counted in the tenant's users, as active or on a
        bill.
    Tier:
      type: string
      enum:
        - free
        - pro
        - scale
      description: The workspace's plan.
    TrialMove:
      type: object
      required:
        - id
        - workspaceId
        - trialId
        - region
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        trialId:
          type: string
          minLength: 1
          maxLength: 100
          description: The Dedicated trial being moved.
        region:
          type: string
          description: 'The region the Free tenant is created in. It is `us`: moved trials run on the US Shared Cluster.'
          readOnly: true
        state:
          allOf:
            - $ref: '#/components/schemas/TrialMoveState'
          readOnly: true
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: |-
            The Free tenant the trial moves into; absent until the move has made it, and again after a
            failed move has removed it.
          readOnly: true
        failureCode:
          type: string
          description: Why a failed move stopped, as a stable code; absent unless `state` is `failed`.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When `state` last changed.
          readOnly: true
      description: |-
        The move of one active Dedicated trial into a Free tenant of a workspace. The trial's owner
        asks for it; it keeps the trial's users, apps and identity providers and ends the Dedicated
        trial once the tenant answers.
    TrialMoveState:
      type: string
      enum:
        - requested
        - exporting
        - importing
        - routing
        - done
        - failed
      description: |-
        How far a trial's move to the Platform has come. A move starts as `requested` and goes through
        `exporting`, `importing` and `routing` to `done`; any step that fails ends it as `failed`.
        `done` and `failed` are final.
    TwoStep:
      type: string
      enum:
        - 'off'
        - optional
        - required
      description: Whether users sign in with a second factor.
    UsageRate:
      type: object
      required:
        - unitPrice
      properties:
        upTo:
          type: integer
          format: int32
          minimum: 1
          description: Inclusive upper total; absent for the final, unbounded band.
        unitPrice:
          type: number
          minimum: 0
          description: USD per additional active user in this band.
      description: A marginal rate above the included users, based on each tenant's total active users.
    User:
      type: object
      required:
        - id
        - tenantId
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        email:
          type: string
          format: email
          description: The user's email address, unique within the tenant regardless of case.
        displayName:
          type: string
          maxLength: 200
          description: A name for people.
        locked:
          type: boolean
          description: Whether an admin has locked the user out. A locked user cannot sign in.
        lockedAt:
          type: string
          format: date-time
          description: When the user was first locked; absent while they are not locked.
          readOnly: true
        lastSignInAt:
          type: string
          format: date-time
          description: When the user last signed in; absent when they never have.
          readOnly: true
        mfaMethods:
          type: array
          items:
            $ref: '#/components/schemas/CredentialType'
          description: |-
            The kinds of second factor the user has enrolled, each named once; empty when they have
            none. Answered only when reading one user.
          readOnly: true
        activeSessions:
          type: integer
          format: int32
          description: How many of the user's sessions are active. Answered only when reading one user.
          readOnly: true
        test:
          type: boolean
          description: |-
            Whether this is the test user a workspace's first project is made with. A test user signs
            in like any other but is never counted in the tenant's users, as active or on a bill.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        A person who signs in to a tenant's apps. Users live in the tenant's region, never in the
        control plane; their passwords and the secrets of their credentials are never read through
        this API.
    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The user's email address, unique within the tenant regardless of case.
        displayName:
          type: string
          maxLength: 200
          description: A name for people.
        locked:
          type: boolean
          description: Whether an admin has locked the user out. A locked user cannot sign in.
        passwordHash:
          allOf:
            - $ref: '#/components/schemas/PasswordHash'
          description: |-
            The password hash the user brings from Keycloak or Auth0, so they keep their password.
            Sent only when creating a user, who then needs an `email`; never read back.
      description: |-
        A person who signs in to a tenant's apps. Users live in the tenant's region, never in the
        control plane; their passwords and the secrets of their credentials are never read through
        this API.
    UserMergePatchUpdate:
      type: object
      properties:
        email:
          type: string
          nullable: true
          format: email
          description: The user's email address, unique within the tenant regardless of case.
        displayName:
          type: string
          nullable: true
          maxLength: 200
          description: A name for people.
        locked:
          type: boolean
          nullable: true
          description: Whether an admin has locked the user out. A locked user cannot sign in.
      description: |-
        A person who signs in to a tenant's apps. Users live in the tenant's region, never in the
        control plane; their passwords and the secrets of their credentials are never read through
        this API.
    UserPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    Webhook:
      type: object
      required:
        - id
        - tenantId
        - url
        - eventTypes
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS address events are sent to. An address that resolves to a private, loopback or
            link-local address is refused when it is saved and again when an event is sent.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/SignInEventType'
          description: The event types the endpoint receives. At least one; none answers 400.
        enabled:
          type: boolean
          description: Whether events are sent to the endpoint.
          default: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: |-
        Where a tenant's sign-in events are sent as they happen: one HTTPS address of the customer's
        own system, and the event types it receives. Each event is sent as a POST, signed with the
        endpoint's signing secret over the raw body (HMAC-SHA256), with the event's ID and type in
        headers. Delivery is at least once and unordered, so a receiver tells repeats by the event ID.
    WebhookDelivery:
      type: object
      required:
        - id
        - eventId
        - eventType
        - status
        - attempts
        - at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        eventId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The ID of the event delivered.
        eventType:
          $ref: '#/components/schemas/SignInEventType'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempts:
          type: integer
          format: int32
          description: How many times the event has been sent.
        httpStatus:
          type: integer
          format: int32
          description: The HTTP status of the last try; absent when it did not get an answer.
        at:
          type: string
          format: date-time
          description: When the last try was made.
        error:
          type: string
          maxLength: 200
          description: Why the last try failed, trimmed to a short text; absent when it did not fail.
      description: One event's delivery to a webhook. The address's response body is never kept.
    WebhookDeliveryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
          description: The deliveries on this page, newest first.
        nextCursor:
          type: string
          description: Set when older deliveries follow; absent on the last page.
      description: A page of a webhook's deliveries, newest first. Pass `nextCursor` back as `cursor` for older ones.
    WebhookDeliveryStatus:
      type: string
      enum:
        - delivered
        - rejected
        - failed
        - retrying
      description: How one delivery of an event to a webhook went.
    WebhookMergePatchUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS address events are sent to. An address that resolves to a private, loopback or
            link-local address is refused when it is saved and again when an event is sent.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/SignInEventType'
          description: The event types the endpoint receives. At least one; none answers 400.
        enabled:
          type: boolean
          nullable: true
          description: Whether events are sent to the endpoint.
      description: |-
        Where a tenant's sign-in events are sent as they happen: one HTTPS address of the customer's
        own system, and the event types it receives. Each event is sent as a POST, signed with the
        endpoint's signing secret over the raw body (HMAC-SHA256), with the event's ID and type in
        headers. Delivery is at least once and unordered, so a receiver tells repeats by the event ID.
    WebhookPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    WebhookWithSecret:
      type: object
      required:
        - id
        - tenantId
        - url
        - eventTypes
        - createdAt
        - signingSecret
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        tenantId:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |-
            The HTTPS address events are sent to. An address that resolves to a private, loopback or
            link-local address is refused when it is saved and again when an event is sent.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/SignInEventType'
          description: The event types the endpoint receives. At least one; none answers 400.
        enabled:
          type: boolean
          description: Whether events are sent to the endpoint.
          default: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        signingSecret:
          type: string
          description: The secret events are signed with. It is never shown again.
          readOnly: true
      description: A webhook with its signing secret, answered only when it is created or its secret rotated.
    Workspace:
      type: object
      required:
        - id
        - name
        - createdAt
        - status
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The company's name, as the console shows it.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: |-
            The signed-in person's role in this workspace, which the console shows its controls by.
            Absent when an API key reads the workspace.
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/WorkspaceStatus'
          description: |-
            Whether the workspace is open to its members and API keys. While it is `suspended`, every
            call on it answers 403 with the code `workspace_suspended`, and the console shows a notice
            in place of its pages.
          readOnly: true
      description: |-
        A customer workspace: the company that signs up. It owns its API keys and its tenants, and
        holds no end-user data.
    WorkspaceMember:
      type: object
      required:
        - id
        - name
        - email
        - role
        - joinedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        joinedAt:
          type: string
          format: date-time
      description: A person who has joined the workspace, not an end user of a tenant.
    WorkspaceMemberPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    WorkspaceMergePatchUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The company's name, as the console shows it.
      description: |-
        A customer workspace: the company that signs up. It owns its API keys and its tenants, and
        holds no end-user data.
    WorkspacePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
          description: The items on this page, oldest first.
        nextCursor:
          type: string
          description: Set when more items follow; absent on the last page.
      description: A page of a list. Pass `nextCursor` back as `cursor` to read the next page.
    WorkspaceStatus:
      type: string
      enum:
        - active
        - suspended
      description: Whether a workspace is open to its members and API keys.
    WorkspaceUsage:
      type: object
      required:
        - tier
        - monthlyPrice
        - includedActiveUsers
        - monthStart
        - monthEnd
        - rates
        - tenants
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        monthlyPrice:
          type: number
          minimum: 0
          description: USD per month; Scale has a yearly term.
        includedActiveUsers:
          type: integer
          format: int32
          minimum: 1
        monthStart:
          type: string
          format: date-time
          description: The UTC calendar month, starting at midnight on its first day.
        monthEnd:
          type: string
          format: date-time
          description: The next month's first midnight, exclusive.
        rates:
          type: array
          items:
            $ref: '#/components/schemas/UsageRate'
          description: Marginal bands in ascending order, ending with an unbounded band.
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantUsage'
          description: All tenants of this workspace, including those with no sign-ins.
      description: Current calendar-month usage. Counts and the included allowance apply per tenant.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: |-
        The console session of the person signed in, for the few operations an API key may not call
        because they act before the person has a workspace.
servers:
  - url: https://api.skycloak.io
    description: The public API.
    variables: {}
