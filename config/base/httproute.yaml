# Public through the shared gateway. No session affinity: the server keeps no
# session state, so any replica can serve any request. The hostname is set per
# overlay.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: skycloak-mcp
  namespace: skycloak-mcp
spec:
  parentRefs:
    - name: gateway
      namespace: istio-ingress
  hostnames:
    - placeholder.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: skycloak-mcp
          port: 8080
