# Pull secret for ghcr.io/sky-cloak/* images. Sourced from Vault (secret/ghcr)
# via ESO. Per overlay because it depends on the cluster's ClusterSecretStore.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: skycloak-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: secret/data/ghcr
        property: token
